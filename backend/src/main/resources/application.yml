spring:
  application:
    name: trina
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/trina}
    username: ${SPRING_DATASOURCE_USERNAME:trina}
    password: ${SPRING_DATASOURCE_PASSWORD:trina}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  mail:
    host: ${MAIL_HOST:maildev}
    port: ${MAIL_PORT:1025}

server:
  port: 8080
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:false}

app:
  jwt:
    secret: ${JWT_SECRET:cambia-este-secreto-de-al-menos-32-bytes-en-.env}
    minutos-vigencia: 60
  cors-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://minio:9000}
    bucket: ${MINIO_BUCKET:trina-media}
    base-media: ${MEDIA_BASE_URL:/media}
  zona-horaria: America/Bogota
